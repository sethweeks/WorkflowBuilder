<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redo Stack Mapper</title>
<!-- vendored locally so the app works offline and needs no CDN allowlisting -->
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/svg2pdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0D0D0D; --card:#1A1A18; --card2:#262624; --line:#333330;
    --text:#FFFFFF; --muted:#9B9A96; --faint:#4D4D4A; --accent:#FF4405;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:13px}
  .kicker{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .kicker.a{color:var(--accent)}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
             padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:12px}
  .wordmark{font-family:Georgia,serif;font-size:19px}
  .wordmark b{color:var(--accent);font-weight:400}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  button{font-family:inherit;font-size:12px;color:var(--text);background:var(--card2);
         border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold}
  button.ghost{background:transparent}

  .app{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 59px)}
  @media (max-width:900px){.app{grid-template-columns:1fr;height:auto}}
  aside{overflow-y:auto;border-right:1px solid var(--line);padding:18px 18px 60px}
  main{overflow:auto;padding:22px;background:#0A0A0A}

  .group{margin-bottom:22px}
  .group > .kicker{display:block;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  label.f{display:block;margin-bottom:9px}
  label.f span{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
  input[type=text],select{width:100%;font-family:inherit;font-size:12px;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:4px;padding:7px 8px}
  input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
  input::placeholder{color:var(--faint)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .step{border:1px solid var(--line);border-radius:5px;margin-bottom:8px;background:var(--card);padding:9px}
  .step.off{opacity:.45}
  .step.off .body{display:none}
  .step.p2{border-color:#5a4a3f}
  .head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .num{font-size:10px;letter-spacing:.1em;color:var(--accent);width:18px;flex:0 0 18px}
  .head input{flex:1;font-weight:bold}
  .head select{flex:0 0 104px;font-size:11px;padding:5px 6px}
  .mini{background:transparent;border:1px solid var(--line);color:var(--muted);
        padding:4px 6px;line-height:1;font-size:11px;border-radius:3px}
  .body{display:grid;gap:7px}
  .hint{font-size:11px;color:var(--faint);line-height:1.5;margin-top:6px}
  .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .seg button{border:none;border-radius:0;flex:1;background:var(--card)}
  .seg button.on{background:var(--card2);box-shadow:inset 0 -2px 0 var(--accent)}

  .stage{border:1px solid var(--line);border-radius:6px;padding:10px;min-width:100%}
  .stage svg{display:block;width:100%;height:auto}
  #file{display:none}
  .foot{padding:10px 20px;border-top:1px solid var(--line);font-size:10px;color:var(--faint);letter-spacing:.06em}
  @media print{header.top,aside,.foot{display:none!important}.app{display:block;height:auto}
               main{padding:0;background:#fff}.stage{border:none;padding:0}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="wordmark">RED<b>O</b></span>
    <span class="kicker">Stack Mapper &nbsp;·&nbsp; Customer Journey Builder</span>
  </div>
  <div class="actions">
    <button class="ghost" id="btnReset">Reset</button>
    <button class="ghost" id="btnLoad">Load JSON</button>
    <button class="ghost" id="btnSave">Save JSON</button>
    <button class="ghost" id="btnPng">PNG</button>
    <button class="primary" id="btnPdf">Download PDF</button>
  </div>
</header>

<div class="app">
  <aside>
    <div class="group">
      <span class="kicker a">Project</span>
      <label class="f"><span>Brand</span><input type="text" id="merchant" value="Acme Outdoors"></label>
      <label class="f"><span>Commerce platform — retypes every step using the old name</span>
        <input type="text" id="platform" value="Shopify"></label>
      <div class="two">
        <label class="f"><span>Subtitle</span><input type="text" id="subtitle" value="Returns journey &amp; integration map"></label>
        <label class="f"><span>Prepared by</span><input type="text" id="prepared" value="Seth Weeks · Redo"></label>
      </div>
      <label class="f"><span>Footer</span><input type="text" id="footer" value="REDO | Private &amp; Confidential"></label>
      <div class="seg" id="themeSeg">
        <button data-theme="dark" class="on">Dark</button>
        <button data-theme="light">Light (print)</button>
      </div>
    </div>

    <div class="group">
      <span class="kicker a">Journey steps</span>
      <div id="steps"></div>
      <button class="ghost" id="btnAdd" style="width:100%;margin-top:4px">+ Add step</button>
      <div class="hint">Every field is free text. Type "Redo" anywhere in the system field and
        the step is drawn in Redo orange. Fill "Redo listens for…" to make the step two-way.</div>
    </div>
  </aside>

  <main><div class="stage" id="stage"></div></main>
</div>

<div class="foot">REDO | Private &amp; Confidential</div>
<input type="file" id="file" accept="application/json">

<datalist id="systems">
  <option>Shopify</option><option>BigCommerce</option><option>Salesforce Commerce Cloud</option>
  <option>Magento</option><option>Commercetools</option><option>WooCommerce</option>
  <option>NetSuite</option><option>Microsoft Dynamics</option><option>SAP</option><option>Custom ERP</option>
  <option>ShipHero</option><option>Manhattan</option><option>3PL (WMS)</option>
  <option>Klaviyo</option><option>Attentive</option><option>Redo</option>
</datalist>

<script>
(function(){
"use strict";

var THEMES = {
  dark:{ bg:"#0D0D0D", card:"#1A1A18", card2:"#262624", line:"#3A3A37",
         text:"#FFFFFF", muted:"#9B9A96", faint:"#4D4D4A", accent:"#FF4405", redoCard:"#1F1714" },
  light:{ bg:"#FFFFFF", card:"#F7F5F2", card2:"#EFECE7", line:"#D9D4CD",
          text:"#1A1A18", muted:"#6E6B66", faint:"#9B9A96", accent:"#FF4405", redoCard:"#FDF1EC" }
};
var theme = "dark";
var lastPlatform = "Shopify";

var DEFAULT_STEPS = [
  { label:"Coverage offered",        sys:"Shopify",              detail:"Redo coverage shown on the product page and in cart", listens:"", status:"on" },
  { label:"Orders & products sync",  sys:"Shopify",              detail:"Redo pulls orders, products and variants",            listens:"New and updated orders", status:"on" },
  { label:"Shopper starts a return", sys:"Redo returns portal",  detail:"Hosted by Redo at returns.brand.com",                 listens:"", status:"on" },
  { label:"RMA created",             sys:"NetSuite",             detail:"Redo creates the RMA in the ERP on approval",         listens:"Return received / inspection complete", status:"on" },
  { label:"Return shipped back",     sys:"ShipHero",             detail:"Return is scanned in at the warehouse",               listens:"Scan-in and inspection status", status:"on" },
  { label:"Outcome processed",       sys:"Shopify",              detail:"Refund, exchange order or store credit issued",       listens:"", status:"on" },
  { label:"Shopper notified",        sys:"Klaviyo",              detail:"Status emails triggered from Redo events",            listens:"", status:"on" }
];

var state = null;
var meas = document.createElement("canvas").getContext("2d");
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function tw(t,f){ meas.font=f; return meas.measureText(t).width; }
function wrap(text,font,maxW){
  var words=String(text).split(" "),lines=[],cur="";
  for(var i=0;i<words.length;i++){
    var t=cur?cur+" "+words[i]:words[i];
    if(tw(t,font)>maxW&&cur){lines.push(cur);cur=words[i];}else{cur=t;}
  }
  if(cur)lines.push(cur); return lines;
}
function today(){ return new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }

/* ------------------------------------------------------------------ panel */
function stepHTML(s,i){
  var o=function(v,l){ return '<option value="'+v+'"'+(s.status===v?" selected":"")+'>'+l+'</option>'; };
  return '<div class="step'+(s.status==="off"?" off":"")+(s.status==="p2"?" p2":"")+'">'+
    '<div class="head">'+
      '<span class="num">'+(i+1<10?"0":"")+(i+1)+'</span>'+
      '<input type="text" class="lbl" value="'+esc(s.label)+'" placeholder="Step name">'+
      '<select class="status">'+o("on","In scope")+o("p2","Phase 2")+o("off","Not in scope")+'</select>'+
    '</div>'+
    '<div class="body">'+
      '<input type="text" class="sys" list="systems" value="'+esc(s.sys)+'" placeholder="System — Shopify, their ERP, Redo…">'+
      '<input type="text" class="detail" value="'+esc(s.detail)+'" placeholder="What happens here">'+
      '<input type="text" class="listens" value="'+esc(s.listens)+'" placeholder="Redo listens for… (leave blank for one-way)">'+
      '<div style="display:flex;gap:6px">'+
        '<button class="mini up">↑</button><button class="mini down">↓</button>'+
        '<span style="flex:1"></span><button class="mini del">Remove</button>'+
      '</div>'+
    '</div></div>';
}
function buildSteps(list){
  document.getElementById("steps").innerHTML = list.map(stepHTML).join("");
}
function readState(){
  var steps=[], els=document.querySelectorAll("#steps .step");
  for(var i=0;i<els.length;i++){
    var e=els[i];
    var s={ label:e.querySelector(".lbl").value, sys:e.querySelector(".sys").value,
            detail:e.querySelector(".detail").value, listens:e.querySelector(".listens").value,
            status:e.querySelector(".status").value };
    steps.push(s);
    e.className="step"+(s.status==="off"?" off":"")+(s.status==="p2"?" p2":"");
  }
  return { merchant:document.getElementById("merchant").value,
           platform:document.getElementById("platform").value,
           subtitle:document.getElementById("subtitle").value,
           prepared:document.getElementById("prepared").value,
           footer:document.getElementById("footer").value,
           theme:theme, steps:steps };
}

/* ------------------------------------------------------------------- draw */
var W=1680, MARGIN=64, GAP=86, ROW_GAP=74;
var F_T="bold 17px Arial", F_S="13px Arial", F_D="italic 10.5px Arial", F_L="10.5px Arial";

function head(x,y,ang,c){
  var L=10,Wd=4.6;
  return '<polygon points="'+x+','+y+' '+
    (x-L*Math.cos(ang)+Wd*Math.sin(ang))+','+(y-L*Math.sin(ang)-Wd*Math.cos(ang))+' '+
    (x-L*Math.cos(ang)-Wd*Math.sin(ang))+','+(y-L*Math.sin(ang)+Wd*Math.cos(ang))+'" fill="'+c+'"/>';
}

function renderSVG(st){
  var C=THEMES[st.theme];
  var steps=st.steps.filter(function(s){ return s.status!=="off"; });
  var n=steps.length;
  var perRow = n<=3 ? Math.max(n,1) : (n===4 ? 2 : 3);
  var cardW = (W - MARGIN*2 - (perRow-1)*GAP)/perRow;

  // measure
  steps.forEach(function(s){
    s.dLines = s.detail ? wrap(s.detail,F_D,cardW-44).slice(0,3) : [];
    s.lLines = s.listens ? wrap(s.listens,F_L,cardW-58).slice(0,2) : [];
    s.h = 96 + s.dLines.length*15 + (s.lLines.length ? 34 + s.lLines.length*14 : 0);
    s.isRedo = /redo/i.test(s.sys);
    s.p2 = s.status==="p2";
  });

  var rows=[];
  for(var i=0;i<n;i+=perRow) rows.push(steps.slice(i,i+perRow));
  rows.forEach(function(r){ r.h = Math.max.apply(null, r.map(function(s){ return s.h; })); });

  var headerH=118, footerH=62;
  var H = headerH + rows.reduce(function(a,r){ return a+r.h; },0) + (rows.length-1)*ROW_GAP + footerH + 30;
  if(!n) H = headerH + footerH + 120;

  var s = '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+C.bg+'"/>';

  /* header */
  var title = st.merchant || "Untitled brand";
  s += '<text x="'+MARGIN+'" y="52" font-family="Arial" font-size="10" letter-spacing="2.6" fill="'+C.accent+'">REDO RETURNS JOURNEY</text>';
  s += '<text x="'+MARGIN+'" y="90" font-family="Georgia, serif" font-size="32" fill="'+C.text+'">'+esc(title)+'</text>';
  if(st.subtitle)
    s += '<text x="'+(MARGIN+tw(title,"32px Georgia")+16)+'" y="90" font-family="Georgia, serif" font-size="16" font-style="italic" fill="'+C.muted+'">'+esc(st.subtitle)+'</text>';
  s += '<text x="'+(W-MARGIN)+'" y="52" text-anchor="end" font-family="Arial" font-size="10" letter-spacing="1.4" fill="'+C.muted+'">'+esc(today().toUpperCase())+'</text>';
  if(st.prepared)
    s += '<text x="'+(W-MARGIN)+'" y="70" text-anchor="end" font-family="Arial" font-size="10" fill="'+C.faint+'">'+esc(st.prepared)+'</text>';
  s += '<line x1="'+MARGIN+'" y1="'+(headerH-8)+'" x2="'+(W-MARGIN)+'" y2="'+(headerH-8)+'" stroke="'+C.line+'"/>';

  /* cards */
  var y = headerH + 18, idx = 0, prev = null;
  rows.forEach(function(row, ri){
    var rtl = ri % 2 === 1;
    row.forEach(function(step, ci){
      var slot = rtl ? (perRow-1-ci) : ci;
      // keep a short final row anchored to the side the arrow arrives on
      if(rtl && row.length < perRow) slot = perRow-1-ci;
      var x = MARGIN + slot*(cardW+GAP);
      step.x = x; step.y = y; step.w = cardW; step.rtl = rtl;

      var stroke = step.p2 ? C.faint : (step.isRedo ? C.accent : C.line);
      var fill   = step.isRedo ? C.redoCard : C.card;
      var dash   = step.p2 ? ' stroke-dasharray="6 4"' : '';

      s += '<rect x="'+x+'" y="'+y+'" width="'+cardW+'" height="'+row.h+'" rx="8" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(step.isRedo?2:1)+'"'+dash+'/>';
      idx++;
      s += '<text x="'+(x+22)+'" y="'+(y+30)+'" font-family="Arial" font-size="10" letter-spacing="2" fill="'+(step.p2?C.faint:C.accent)+'">'+(idx<10?"0":"")+idx+(step.p2?"  ·  PHASE 2":"")+'</text>';
      s += '<text x="'+(x+22)+'" y="'+(y+56)+'" font-family="Arial" font-size="17" font-weight="bold" fill="'+(step.p2?C.muted:C.text)+'">'+esc(step.label)+'</text>';
      s += '<text x="'+(x+22)+'" y="'+(y+78)+'" font-family="Arial" font-size="13" fill="'+(step.isRedo?C.accent:(step.p2?C.faint:C.muted))+'">'+esc(step.sys)+'</text>';
      var ty = y+96;
      step.dLines.forEach(function(l){
        s += '<text x="'+(x+22)+'" y="'+ty+'" font-family="Arial" font-size="10.5" font-style="italic" fill="'+C.muted+'">'+esc(l)+'</text>';
        ty += 15;
      });
      if(step.lLines.length){
        ty += 8;
        s += '<line x1="'+(x+22)+'" y1="'+(ty-8)+'" x2="'+(x+cardW-22)+'" y2="'+(ty-8)+'" stroke="'+C.line+'"/>';
        ty += 10;
        s += '<text x="'+(x+22)+'" y="'+ty+'" font-family="Arial" font-size="8.5" letter-spacing="1.5" fill="'+C.accent+'">&#8630; REDO LISTENS FOR</text>';
        ty += 15;
        step.lLines.forEach(function(l){
          s += '<text x="'+(x+22)+'" y="'+ty+'" font-family="Arial" font-size="10.5" fill="'+(step.p2?C.muted:C.text)+'">'+esc(l)+'</text>';
          ty += 14;
        });
      }

      /* connector from previous step */
      if(prev){
        var c = prev.p2 && step.p2 ? C.faint : C.muted;
        var d = prev.p2 && step.p2 ? ' stroke-dasharray="5 4"' : '';
        if(prev.y === step.y){
          var x1 = rtl ? prev.x : prev.x+prev.w, x2 = rtl ? step.x+step.w : step.x;
          var yy = y + row.h/2;
          s += '<line x1="'+x1+'" y1="'+yy+'" x2="'+x2+'" y2="'+yy+'" stroke="'+c+'" stroke-width="1.5"'+d+'/>';
          s += head(x2, yy, rtl?Math.PI:0, c);
        } else {
          var sx = prev.x + prev.w/2, sy = prev.y + rows[ri-1].h;
          var ex = step.x + step.w/2, ey = step.y;
          s += '<path d="M'+sx+','+sy+' C'+sx+','+(sy+38)+' '+ex+','+(ey-38)+' '+ex+','+ey+'" fill="none" stroke="'+c+'" stroke-width="1.5"'+d+'/>';
          s += head(ex, ey, Math.PI/2, c);
        }
      }
      prev = step;
    });
    y += row.h + ROW_GAP;
  });

  if(!n) s += '<text x="'+(W/2)+'" y="'+(headerH+70)+'" text-anchor="middle" font-family="Arial" font-size="14" fill="'+C.faint+'">No steps in scope — turn one back on in the panel.</text>';

  /* footer */
  var anyP2 = st.steps.some(function(x){ return x.status==="p2"; });
  var fy = H - 30;
  s += '<line x1="'+MARGIN+'" y1="'+(fy-24)+'" x2="'+(W-MARGIN)+'" y2="'+(fy-24)+'" stroke="'+C.line+'"/>';
  s += '<text x="'+MARGIN+'" y="'+fy+'" font-family="Arial" font-size="9" letter-spacing="1.4" fill="'+C.muted+'">'+esc((st.footer||"").toUpperCase())+'</text>';
  s += '<text x="'+(W-MARGIN)+'" y="'+fy+'" text-anchor="end" font-family="Arial" font-size="9" letter-spacing="1.2" fill="'+C.faint+'">ORANGE = REDO'+
       (anyP2?"  ·  DASHED = PHASE 2":"")+'  ·  &#8630; = REDO LISTENS FOR AN EVENT BACK</text>';

  return '<svg xmlns="http://www.w3.org/2000/svg" id="diagram" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" font-family="Arial">'+s+'</svg>';
}

function render(){
  state = readState();
  var stage = document.getElementById("stage");
  stage.style.background = THEMES[state.theme].bg;
  stage.style.borderColor = THEMES[state.theme].line;
  stage.innerHTML = renderSVG(state);
  try{ localStorage.setItem("redoStackMapperJourney", JSON.stringify(state)); }catch(e){}
}

/* ---------------------------------------------------------------- exports */
function fileName(ext){
  return (state.merchant||"diagram").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()+"-redo-journey."+ext;
}
function download(blob,name){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function svgEl(){ return document.getElementById("diagram"); }
function toCanvas(scale,cb){
  var el=svgEl(), w=el.viewBox.baseVal.width, h=el.viewBox.baseVal.height;
  var data=new XMLSerializer().serializeToString(el), img=new Image();
  img.onload=function(){
    var cv=document.createElement("canvas"); cv.width=w*scale; cv.height=h*scale;
    var ctx=cv.getContext("2d");
    ctx.fillStyle=THEMES[state.theme].bg; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height); cb(cv,w,h);
  };
  img.onerror=function(){ alert("Could not rasterize the diagram."); };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(data);
}
function exportPNG(){ toCanvas(2,function(cv){ cv.toBlob(function(b){ download(b,fileName("png")); }); }); }

var CDN=["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
         "https://cdnjs.cloudflare.com/ajax/libs/svg2pdf.js/2.2.3/svg2pdf.umd.min.js"];
function ensureLibs(cb){
  if(window.jspdf&&window.jspdf.jsPDF) return cb(true);
  var i=0;
  (function next(){
    if(i>=CDN.length) return cb(!!(window.jspdf&&window.jspdf.jsPDF));
    var sc=document.createElement("script"); sc.src=CDN[i++];
    sc.onload=next; sc.onerror=function(){ cb(false); };
    document.head.appendChild(sc);
  })();
}
function exportPDF(){ ensureLibs(function(ok){ ok?doExportPDF():window.print(); }); }
function doExportPDF(){
  var el=svgEl(), w=el.viewBox.baseVal.width, h=el.viewBox.baseVal.height;
  var ctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  var doc=new ctor({orientation:w>h?"landscape":"portrait",unit:"pt",format:[w*0.75,h*0.75]});
  if(doc.svg){
    doc.svg(el,{x:0,y:0,width:w*0.75,height:h*0.75})
       .then(function(){ doc.save(fileName("pdf")); })
       .catch(function(){ rasterPDF(doc,w,h); });
  } else rasterPDF(doc,w,h);
}
function rasterPDF(doc,w,h){
  toCanvas(2.5,function(cv){
    doc.addImage(cv.toDataURL("image/png"),"PNG",0,0,w*0.75,h*0.75);
    doc.save(fileName("pdf"));
  });
}

/* ------------------------------------------------------------ persistence */
function applyState(st){
  ["merchant","platform","subtitle","prepared","footer"].forEach(function(k){
    var el=document.getElementById(k); if(el) el.value = st[k]||"";
  });
  lastPlatform = st.platform || "";
  theme = st.theme==="light" ? "light" : "dark";
  var segs=document.querySelectorAll("#themeSeg button");
  for(var i=0;i<segs.length;i++) segs[i].className = segs[i].dataset.theme===theme?"on":"";
  buildSteps(st.steps&&st.steps.length?st.steps:DEFAULT_STEPS);
  render();
}
function reset(){
  applyState({ merchant:"Acme Outdoors", platform:"Shopify",
    subtitle:"Returns journey & integration map", prepared:"Seth Weeks · Redo",
    footer:"REDO | Private & Confidential", theme:"dark",
    steps: JSON.parse(JSON.stringify(DEFAULT_STEPS)) });
}
function renumber(){
  var nums=document.querySelectorAll("#steps .num");
  for(var i=0;i<nums.length;i++) nums[i].textContent=(i+1<10?"0":"")+(i+1);
}

/* ----------------------------------------------------------------- wiring */
document.addEventListener("input", function(e){
  if(!e.target.closest("aside")) return;
  if(e.target.id === "platform"){
    var now = e.target.value;
    if(lastPlatform){
      var fields=document.querySelectorAll("#steps .sys");
      for(var i=0;i<fields.length;i++){
        if(fields[i].value.trim().toLowerCase() === lastPlatform.trim().toLowerCase())
          fields[i].value = now;
      }
    }
    lastPlatform = now;
  }
  render();
});
document.addEventListener("change", function(e){ if(e.target.closest("aside")) render(); });

document.getElementById("steps").addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  var card=b.closest(".step");
  if(b.classList.contains("del")) card.remove();
  if(b.classList.contains("up") && card.previousElementSibling)
    card.parentNode.insertBefore(card, card.previousElementSibling);
  if(b.classList.contains("down") && card.nextElementSibling)
    card.parentNode.insertBefore(card.nextElementSibling, card);
  renumber(); render();
});
document.getElementById("themeSeg").addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  theme=b.dataset.theme;
  var segs=this.querySelectorAll("button");
  for(var i=0;i<segs.length;i++) segs[i].className = segs[i]===b?"on":"";
  render();
});
document.getElementById("btnAdd").addEventListener("click", function(){
  var count=document.querySelectorAll("#steps .step").length;
  document.getElementById("steps").insertAdjacentHTML("beforeend",
    stepHTML({label:"New step",sys:"",detail:"",listens:"",status:"on"}, count));
  render();
});
document.getElementById("btnReset").addEventListener("click", function(){
  if(confirm("Reset to the default journey?")) reset();
});
document.getElementById("btnSave").addEventListener("click", function(){
  download(new Blob([JSON.stringify(readState(),null,2)],{type:"application/json"}),fileName("json"));
});
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("file").click(); });
document.getElementById("file").addEventListener("change", function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ try{ applyState(JSON.parse(r.result)); }catch(err){ alert("That file isn't a valid Stack Mapper config."); } };
  r.readAsText(f); e.target.value="";
});
document.getElementById("btnPng").addEventListener("click", exportPNG);
document.getElementById("btnPdf").addEventListener("click", exportPDF);

var saved=null;
try{ saved=JSON.parse(localStorage.getItem("redoStackMapperJourney")); }catch(e){}
if(saved&&saved.steps) applyState(saved); else reset();

})();
</script>
</body>
</html>
